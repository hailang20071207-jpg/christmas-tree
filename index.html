<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>终极朋友圈圣诞树</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at top, #0b1d3a, #020617);
  color: #fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
}
.scene {
  width: 100%;
  max-width: 420px;
  padding: 16px 12px 24px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  position: relative;
}
.tree {
  position: relative;
  width: min(260px, 90vw);
  height: calc(min(260px, 90vw) * 1.35);
}
.layer {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  border-left: 50% solid transparent;
  border-right: 50% solid transparent;
  border-bottom: 28% solid #0f7a3a;
  filter: drop-shadow(0 6px 12px rgba(0,0,0,.4));
}
.layer.l1 { top: 0; }
.layer.l2 { top: 18%; border-bottom-width: 32%; }
.layer.l3 { top: 38%; border-bottom-width: 36%; }
.trunk {
  position: absolute;
  bottom: -10%;
  left: 50%;
  transform: translateX(-50%);
  width: 14%;
  height: 14%;
  background: #7a4a21;
  border-radius: 6px;
}
.star {
  position: absolute;
  top: -10%;
  left: 50%;
  transform: translateX(-50%) rotate(35deg);
  width: 0;
  height: 0;
  border-right: 18px solid transparent;
  border-bottom: 14px solid gold;
  border-left: 18px solid transparent;
  cursor: pointer;
  animation: twinkle 2s infinite ease-in-out;
}
.star::before {
  content: '';
  position: absolute;
  left: -18px;
  top: 9px;
  width: 0;
  height: 0;
  border-right: 18px solid transparent;
  border-top: 14px solid gold;
  border-left: 18px solid transparent;
}
@keyframes twinkle {
  0%,100% { filter: drop-shadow(0 0 4px gold); }
  50% { filter: drop-shadow(0 0 10px gold); }
}
.light {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: red;
  box-shadow: 0 0 6px currentColor;
  cursor: pointer;
  touch-action: manipulation;
}
.controls {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  position: relative;
  z-index: 2;
}
button {
  padding: 12px 0;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  background: #22c55e;
  color: #022c22;
  font-size: 16px;
  font-weight: 600;
}
button.secondary { background: #38bdf8; color: #042a3a; }
.hint { font-size: 12px; opacity: .8; text-align: center; position: relative; z-index:2; }
.snowflake {
  position: fixed;
  top: -10px;
  width: 8px;
  height: 8px;
  background: white;
  border-radius: 50%;
  opacity: 0.8;
  pointer-events: none;
  animation-name: fall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0.2; }
}
#playMusic {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  padding: 8px 16px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  background: #facc15;
  color: #1f2937;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="scene">
  <div class="tree" id="tree">
    <div class="star" id="star" title="点我切换灯光"></div>
    <div class="layer l1"></div>
    <div class="layer l2"></div>
    <div class="layer l3"></div>
    <div class="trunk"></div>
  </div>
  <div class="controls">
    <button id="toggle">🎄 开 / 关 灯光</button>
    <button id="shuffle" class="secondary">🎨 更换颜色</button>
  </div>
  <div class="hint">点击彩灯单独控制 · 点星星整体控制 · 适合朋友圈</div>
  <audio id="bgm" loop>
    <source src="https://actions.google.com/sounds/v1/holiday/christmas_bells.ogg" type="audio/ogg">
  </audio>
  <button id="playMusic">🎵 播放音乐</button>
</div>
<script>
const tree=document.getElementById('tree');
const toggleBtn=document.getElementById('toggle');
const shuffleBtn=document.getElementById('shuffle');
const star=document.getElementById('star');
const bgm=document.getElementById('bgm');
const playMusicBtn=document.getElementById('playMusic');
const colors=['#ef4444','#22c55e','#3b82f6','#eab308','#a855f7'];
let lightsOn=true;
function random(min,max){return Math.random()*(max-min)+min;}
const lights=[];
for(let i=0;i<22;i++){const l=document.createElement('div');l.className='light';l.style.left=random(15,tree.clientWidth-25)+'px';l.style.top=random(30,tree.clientHeight-60)+'px';l.style.color=colors[i%colors.length];l.style.background=l.style.color;l.dataset.on='1';l.addEventListener('click',e=>{e.stopPropagation();toggleLight(l);});tree.appendChild(l);lights.push(l);}
function toggleLight(l){if(l.dataset.on==='1'){l.style.opacity='0.25';l.dataset.on='0';}else{l.style.opacity='1';l.dataset.on='1';}}
function setAll(on){lightsOn=on;lights.forEach(l=>{l.dataset.on=on?'1':'0';l.style.opacity=on?'1':'0.25';});}
toggleBtn.onclick=()=>setAll(!lightsOn);
star.onclick=()=>setAll(!lightsOn);
shuffleBtn.onclick=()=>lights.forEach(l=>{const c=colors[Math.floor(Math.random()*colors.length)];l.style.color=c;l.style.background=c;});
playMusicBtn.onclick=()=>{if(bgm.paused){bgm.play();playMusicBtn.textContent='🔇 停止音乐';}else{bgm.pause();playMusicBtn.textContent='🎵 播放音乐';}};
for(let i=0;i<50;i++){const snow=document.createElement('div');snow.className='snowflake';snow.style.left=random(0,100)+'vw';snow.style.animationDuration=random(5,12)+'s';snow.style.opacity=random(0.3,0.8);snow.style.width=random(4,10)+'px';snow.style.height=snow.style.width;document.body.appendChild(snow);}
</script>
</body>
</html>
