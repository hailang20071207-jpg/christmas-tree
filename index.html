<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>可互动圣诞树</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0b1d3a, #020617);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .scene {
      width: 100%;
      max-width: 420px; /* 手机竖屏友好 */
      padding: 16px 12px 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .tree {
      position: relative;
      width: min(260px, 90vw);
      height: calc(min(260px, 90vw) * 1.35);
    }

    .layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-left: 50% solid transparent;
      border-right: 50% solid transparent;
      border-bottom: 28% solid #0f7a3a;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.4));
    }
    .layer.l1 { top: 0; }
    .layer.l2 { top: 18%; border-bottom-width: 32%; }
    .layer.l3 { top: 38%; border-bottom-width: 36%; }

    .trunk {
      position: absolute;
      bottom: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 14%;
      height: 14%;
      background: #7a4a21;
      border-radius: 6px;
    }

    .star {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%) rotate(35deg);
      width: 0;
      height: 0;
      border-right: 18px solid transparent;
      border-bottom: 14px solid gold;
      border-left: 18px solid transparent;
      cursor: pointer;
      animation: twinkle 2s infinite ease-in-out;
    }
    .star::before {
      content: '';
      position: absolute;
      left: -18px;
      top: 9px;
      width: 0;
      height: 0;
      border-right: 18px solid transparent;
      border-top: 14px solid gold;
      border-left: 18px solid transparent;
    }

    @keyframes twinkle {
      0%, 100% { filter: drop-shadow(0 0 4px gold); }
      50% { filter: drop-shadow(0 0 10px gold); }
    }

    .light {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: red;
      box-shadow: 0 0 6px currentColor;
      cursor: pointer;
      touch-action: manipulation;
    }

    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      padding: 12px 0;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: #022c22;
      font-size: 16px;
      font-weight: 600;
    }
    button.secondary { background: #38bdf8; color: #042a3a; }

    .hint {
      font-size: 12px;
      opacity: .8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="tree" id="tree">
      <div class="star" id="star" title="点我切换灯光"></div>
      <div class="layer l1"></div>
      <div class="layer l2"></div>
      <div class="layer l3"></div>
      <div class="trunk"></div>
    </div>

    <div class="controls">
      <button id="toggle">🎄 开 / 关 灯光</button>
      <button id="shuffle" class="secondary">🎨 更换颜色</button>
    </div>

    <div class="hint">点击彩灯单独控制 · 点星星整体控制<br/>适合竖屏分享 / 朋友圈</div>
  </div>

  <script>
    const tree = document.getElementById('tree');
    const toggleBtn = document.getElementById('toggle');
    const shuffleBtn = document.getElementById('shuffle');
    const star = document.getElementById('star');

    const colors = ['#ef4444', '#22c55e', '#3b82f6', '#eab308', '#a855f7'];
    let lightsOn = true;

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    const lights = [];
    const rect = () => tree.getBoundingClientRect();

    for (let i = 0; i < 22; i++) {
      const l = document.createElement('div');
      l.className = 'light';
      l.style.left = random(15, rect().width - 25) + 'px';
      l.style.top = random(30, rect().height - 60) + 'px';
      l.style.color = colors[i % colors.length];
      l.style.background = l.style.color;
      l.dataset.on = '1';
      l.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLight(l);
      });
      tree.appendChild(l);
      lights.push(l);
    }

    function toggleLight(l) {
      if (l.dataset.on === '1') {
        l.style.opacity = '0.25';
        l.dataset.on = '0';
      } else {
        l.style.opacity = '1';
        l.dataset.on = '1';
      }
    }

    function setAll(on) {
      lightsOn = on;
      lights.forEach(l => {
        l.dataset.on = on ? '1' : '0';
        l.style.opacity = on ? '1' : '0.25';
      });
    }

    toggleBtn.onclick = () => setAll(!lightsOn);
    star.onclick = () => setAll(!lightsOn);

    shuffleBtn.onclick = () => {
      lights.forEach(l => {
        const c = colors[Math.floor(Math.random() * colors.length)];
        l.style.color = c;
        l.style.background = c;
      });
    };
  </script>
</body>
</html>
